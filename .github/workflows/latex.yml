name: Build Engineering Curves

on:
  push:
    branches:
      - main
    paths:
      - 'cycloid/**'
      - 'epicycloid/**'
      - 'hypocycloid/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Cycloid PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cycloid/cycloid.tex

      - name: Compile Epicycloid PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: epicycloid/epicycloid.tex

      - name: Compile Hypocycloid PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: hypocycloid/hypocycloid.tex

      - name: Commit and push generated PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cycloid/*.pdf epicycloid/*.pdf hypocycloid/*.pdf
          git diff --cached --quiet && echo "No PDF changes to commit." && exit 0
          git commit -m "Auto-compile presentation PDFs [skip ci]"
          git push
