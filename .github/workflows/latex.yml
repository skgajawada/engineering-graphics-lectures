name: Build Engineering Graphics

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '.github/workflows/latex.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile all LaTeX presentations
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            find . -type f -name "*.tex" \
              -not -path "./.git/*" \
              -print0 |
            while IFS= read -r -d '' file; do

              dir=$(dirname "$file")
              name=$(basename "$file" .tex)

              echo "========================================"
              echo "Compiling: $file"
              echo "========================================"

              cd "$dir"

              latexmk \
                -pdf \
                -g \
                -interaction=nonstopmode \
                -halt-on-error \
                "$name.tex"

              cd - > /dev/null

            done

      - name: Show generated PDFs
        run: |
          echo "===== Generated PDFs ====="
          find . -type f -name "*.pdf" \
            -not -path "./.git/*" \
            -exec ls -lh {} \;

      - name: Commit and push generated PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f -- '**/*.pdf'

          echo "===== Git status ====="
          git status --short

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git commit -m "Auto-compile presentation PDFs [skip ci]"
          git push
