name: Build LaTeX PDFs

on:
  push:
    branches:
      - main
    paths:
      - 'cycloid/cycloid.tex'
      - 'epicycloid/epicycloid.tex'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ----------------------------------------------------------
      # Build Cycloid PDF
      # ----------------------------------------------------------
      - name: Compile Cycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cycloid
          root_file: cycloid.tex

      # ----------------------------------------------------------
      # Build Epicycloid PDF
      # ----------------------------------------------------------
      - name: Compile Epicycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: epicycloid
          root_file: epicycloid.tex

      # ----------------------------------------------------------
      # Commit generated PDFs
      # ----------------------------------------------------------
      - name: Save PDFs to repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "build: update cycloid and epicycloid PDFs"
          file_pattern: |
            cycloid/cycloid.pdf
            epicycloid/epicycloid.pdf
