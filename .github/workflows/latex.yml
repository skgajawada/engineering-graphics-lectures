name: Build LaTeX PDFs

on:
  push:
    branches:
      - main
    paths:
      - 'cycloid/cycloid.tex'
      - 'cycloid/cycloid_a.tex'
      - 'epicycloid/epicycloid.tex'
      - 'hypocycloid/hypocycloid.tex'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Compile Cycloid (Standard)
      # --------------------------------------------------
      - name: Compile Cycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cycloid/cycloid.tex

      # --------------------------------------------------
      # Compile Cycloid (Animated)
      # --------------------------------------------------
      - name: Compile Animated Cycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cycloid/cycloid_a.tex

      # --------------------------------------------------
      # Compile Epicycloid
      # --------------------------------------------------
      - name: Compile Epicycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: epicycloid/epicycloid.tex

      # --------------------------------------------------
      # Compile Hypocycloid
      # --------------------------------------------------
      - name: Compile Hypocycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: hypocycloid/hypocycloid.tex

      # --------------------------------------------------
      # Save generated PDFs
      # --------------------------------------------------
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f cycloid/cycloid.pdf
          git add -f cycloid/cycloid_a.pdf
          git add -f epicycloid/epicycloid.pdf
          git add -f hypocycloid/hypocycloid.pdf

          if git diff --cached --quiet; then
            echo "No PDF changes detected."
          else
            git commit -m "build: update all engineering curve PDFs including cycloid animation"
            git push
          fi
