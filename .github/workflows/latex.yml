name: Build LaTeX PDF

on:
  push:
    branches:
      - main
    paths:
      - 'cycloid/cycloid.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compile Cycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cycloid
          root_file: cycloid.tex

      - name: Save PDF to repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "build: update cycloid PDF"
          file_pattern: "cycloid/cycloid.pdf"
