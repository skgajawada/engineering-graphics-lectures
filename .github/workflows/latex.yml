name: Build Engineering Curves & Animations

on:
  push:
    branches:
      - main
    paths:
      - 'cycloid/**'
      - 'epicycloid/**'
      - 'hypocycloid/**'
      - 'animation/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Setup Python and Run Animation Generator
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install numpy matplotlib pillow

      - name: Generate Looping Cycloid Animation GIF
        run: |
          python animation/generate_cycloid.py

      # --------------------------------------------------
      # Compile LaTeX Presentations (PDFs)
      # --------------------------------------------------
      - name: Compile Cycloid Standard PDF
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cycloid
          root_file: cycloid.tex

      - name: Compile Cycloid Animated PDF
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cycloid
          root_file: cycloid_a.tex

      - name: Compile Epicycloid PDF
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: epicycloid
          root_file: epicycloid.tex

      - name: Compile Hypocycloid PDF
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: hypocycloid
          root_file: hypocycloid.tex

      # --------------------------------------------------
      # Save Generated Assets Back to Repository
      # --------------------------------------------------
      - name: Commit generated PDFs and GIFs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "build: update curve PDFs and looping cycloid animation gif"
          file_pattern: |
            cycloid/cycloid.pdf
            cycloid/cycloid_a.pdf
            cycloid_animation.gif
            epicycloid/epicycloid.pdf
            hypocycloid/hypocycloid.pdf
