name: Build Engineering Curves & Animations

on:
  push:
    branches:
      - main
    paths:
      - 'cycloid/**'
      - 'epicycloid/**'
      - 'hypocycloid/**'
      - 'animation/**'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Set up Python for Animation Generation
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install numpy matplotlib pillow

      - name: Generate Cycloid Animation GIF
        run: |
          python animation/generate_cycloid.py

      # --------------------------------------------------
      # Compile LaTeX Presentations (PDFs)
      # --------------------------------------------------
      - name: Compile Cycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cycloid/cycloid.tex

      - name: Compile Animated Beamer Cycloid
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cycloid/cycloid_a.tex

      - name: Compile Epicycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: epicycloid/epicycloid.tex

      - name: Compile Hypocycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: hypocycloid/hypocycloid.tex

      # --------------------------------------------------
      # Save Generated Files Back to Repository
      # --------------------------------------------------
      - name: Commit generated assets (PDFs and GIFs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f cycloid/cycloid.pdf
          git add -f cycloid/cycloid_a.pdf
          git add -f cycloid_animation.gif
          git add -f epicycloid/epicycloid.pdf
          git add -f hypocycloid/hypocycloid.pdf

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "build: update engineering curve PDFs and Python looping animation"
            git push
          fi
