name: Build LaTeX PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Cycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          root_file: engineering-curves/cycloid/cycloid.tex
          latexmk_use_xelatex: false

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: cycloid-presentation
          path: engineering-curves/cycloid/cycloid.pdf
