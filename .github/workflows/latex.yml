name: Build LaTeX PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Cycloid presentation
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cycloid
          root_file: cycloid.tex

      - name: Check generated files
        run: |
          echo "Files generated:"
          find cycloid -maxdepth 2 -type f -print

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: cycloid-presentation
          path: cycloid/cycloid.pdf
