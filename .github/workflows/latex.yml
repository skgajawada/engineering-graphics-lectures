name: Build Engineering Graphics

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '.github/workflows/latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compile Only Modified or New LaTeX Presentations
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            find . -type f -name "*.tex" -not -path "./.git/*" | while read -r file; do
              dir=$(dirname "$file")
              name=$(basename "$file" .tex)
              pdf_file="$dir/$name.pdf"

              # Check if the .tex file was modified, is untracked, or if the PDF doesn't exist yet
              if git status --porcelain "$file" | grep -qE '^\??[AM]' || [ ! -f "$pdf_file" ]; then
                echo "========================================"
                echo "Compiling active/new file: $file"
                echo "========================================"

                cd "$dir"
                latexmk -pdf -interaction=nonstopmode -halt-on-error "$name.tex"
                cd - > /dev/null
              else
                echo "Skipping (no changes): $file"
              fi
            done

      - name: Commit and push generated PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -- '**/*.pdf'

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git commit -m "Auto-compile presentation PDFs [skip ci]"
          git push
